name: manyfold-thumbnails-dev

services:
  manyfold:
    build:
      context: .
      args:
        MANYFOLD_IMAGE: ${MANYFOLD_IMAGE:-manyfold3d/manyfold-solo:0.154.0@sha256:fc6deade2a191033d109a8296876d504334dc14bee6097d0ae3ca4a218354ff7}
    image: manyfold-thumbnails-dev
    ports:
      - "127.0.0.1:3215:3214"
    environment:
      SECRET_KEY_BASE: local-plugin-development-only-8e7b41e9a6c547ca8b32c78c887bb7be
      PLUGINS_PATH: /plugins
      MANYFOLD_THUMBNAILS_CATWALK_CACHE: ${MANYFOLD_THUMBNAILS_CATWALK_CACHE:-/config/catwalk}
      MULTIUSER: disabled
      PUID: "1000"
      PGID: "1000"
    volumes:
      - local-config:/config
      - .:/plugins/manyfold_thumbnails:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:3214/health"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 30

volumes:
  local-config:
