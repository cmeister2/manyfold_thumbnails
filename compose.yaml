name: manyfold-thumbnails-dev

services:
  manyfold:
    build:
      context: .
      args:
        MANYFOLD_IMAGE: ${MANYFOLD_IMAGE:-manyfold3d/manyfold-solo:0.151.0@sha256:772bcb18f0cb69d4fd0630d4676516f34fb37e42c3ac9d65eea5f173728e818e}
    image: manyfold-thumbnails-dev
    ports:
      - "127.0.0.1:3215:3214"
    environment:
      SECRET_KEY_BASE: local-plugin-development-only-8e7b41e9a6c547ca8b32c78c887bb7be
      PLUGINS_PATH: /plugins
      MULTIUSER: disabled
      PUID: "1000"
      PGID: "1000"
    volumes:
      - local-config:/config
      - .:/plugins/manyfold_thumbnails:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:3214/health"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 30

volumes:
  local-config:
