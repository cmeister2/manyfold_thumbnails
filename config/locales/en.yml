en:
  manyfold_thumbnails:
    settings:
      menu: Thumbnail settings
      show:
        heading: Thumbnail settings
        description: Catwalk renders the selected file types. By default, it is enabled for types without a built-in Manyfold thumbnail provider.
        download: Catwalk is downloaded from GitHub when an enabled file first needs a thumbnail, then reused from the local cache.
        renders_disabled: Model thumbnail generation is currently disabled in Manyfold.
        derivatives_settings: Open Derivatives settings
        file_types: File types
        format_description: What it is
        save: Save thumbnail settings
        changes: Changes apply to future thumbnails and manual regeneration. Existing thumbnails are retained.
        use_catwalk: Enable Catwalk
        core_provider: Built-in provider
        current_provider: Current provider
        no_core_provider: None
        disabled: Disabled
        checkbox_label: "Enable Catwalk for %{extensions}"
        aliases: Extensions on the same row use the same provider and are enabled together. Enable Catwalk to replace the built-in provider; disabling it restores that provider where available.
        overrides:
          none: Catwalk is not overriding any built-in thumbnail providers.
          active: "Catwalk currently overrides:"
      update:
        success: Thumbnail settings saved.
        invalid_selection: Select the file types Catwalk should render.
