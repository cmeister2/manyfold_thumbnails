name: CI and release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test plugin and package (Manyfold ${{ matrix.manyfold }})
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - manyfold: '0.151.0'
            image: manyfold3d/manyfold-solo:0.151.0@sha256:772bcb18f0cb69d4fd0630d4676516f34fb37e42c3ac9d65eea5f173728e818e
          - manyfold: latest
            image: manyfold3d/manyfold-solo:latest
    env:
      MANYFOLD_IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Pull test host image
        run: docker pull "$MANYFOLD_IMAGE"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:release
      - name: Check Catwalk formats and test plugin and package
        run: bin/test

  release:
    name: Preview or publish plugin release
    needs: test
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Preview release
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: npm run release:dry-run
      - name: Tag and publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  success:
    name: Success
    if: ${{ always() }}
    needs: [test, release]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Require all jobs to pass
        env:
          NEEDS_RESULTS: ${{ toJSON(needs) }}
        shell: bash
        run: jq -e 'all(.[]; .result == "success")' <<< "$NEEDS_RESULTS"
